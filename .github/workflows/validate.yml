name: Node validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RUN_DB_INTEGRATION_TESTS: '1'
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/htet_kabar_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: htet_kabar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d htet_kabar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
