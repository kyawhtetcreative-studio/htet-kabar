# Render Blueprint for HTET KABAR. Review resources before deploying.
services:
  - type: web
    name: htet-kabar-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: htet-kabar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: htet-kabar-db
    databaseName: htet_kabar
    user: htet_kabar
    plan: free
    region: singapore
